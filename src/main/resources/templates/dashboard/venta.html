<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <th:block layout:fragment="head">
        <title>Dashboard Ventas</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            body {
                background-color: #f4f6fa;
                font-family: 'Segoe UI', Arial, sans-serif;
            }
            .kpi-card {
                border-radius: 1rem;
                height: 120px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 1rem 1.2rem;
                color: white;
                transition: transform 0.08s;
            }
            .kpi-card:hover {
                transform: translateY(-4px) scale(1.01);
                box-shadow: 0 6px 24px rgba(0,0,0,0.10);
            }
            .kpi-icon {
                font-size: 2.3rem;
                opacity: 0.84;
            }
            .kpi-content h6 {
                font-size: 1rem;
                margin-bottom: 2px;
                font-weight: 500;
                letter-spacing: 0.5px;
            }
            .kpi-content h4 {
                font-size: 1.5rem;
                font-weight: 700;
                margin: 0;
            }
            .section-title {
                font-size: 1.25rem;
                font-weight: bold;
                color: #25334d;
                margin-bottom: 1.1rem;
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .shadow-soft {
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
                border-radius: 1.1rem;
            }
            .bg-gradient-green {
                background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            }
            .bg-gradient-orange {
                background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
                color: #4a3c00;
            }
            .bg-gradient-blue {
                background: linear-gradient(135deg, #56ccf2 0%, #2f80ed 100%);
            }
            .bg-gradient-purple {
                background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
                color: #4d3561;
            }
            .bg-gradient-navy {
                background: linear-gradient(135deg, #434343 0%, #262626 100%);
            }
            .card {
                border: none;
            }
            .form-control[type="date"] {
                font-size: 0.95rem;
            }
            .btn-primary {
                font-size: 0.95rem;
                padding: 0.5rem 1.2rem;
                border-radius: 0.7rem;
                background: linear-gradient(90deg, #36d1c4 0%, #5b86e5 100%);
                border: none;
                transition: background 0.2s;
            }
            .btn-primary:hover {
                background: linear-gradient(90deg, #5b86e5 0%, #36d1c4 100%);
            }
            canvas {
                max-height: 250px;
            }
            @media (max-width: 768px) {
                .kpi-card { height: auto; flex-direction: column; align-items: flex-start; }
                .kpi-icon { margin-bottom: 0.4rem; }
            }
        </style>
    </th:block>
</head>

<body>
    <div layout:fragment="content" class="container py-4">
        <h3 class="text-center mb-5" style="color: #25334d; letter-spacing: 0.5px;">
            📊 <strong>Dashboard de Ventas</strong>
        </h3>

        <!-- KPIs -->
        <div class="row g-4 mb-5">
            <div class="col-md-2 col-6">
                <div class="kpi-card bg-gradient-green">
                    <div class="kpi-icon">🛒</div>
                    <div class="kpi-content">
                        <h6>Ventas Hoy</h6>
                        <h4 th:text="${ventasHoy}">--</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-2 col-6">
                <div class="kpi-card bg-gradient-orange">
                    <div class="kpi-icon">💰</div>
                    <div class="kpi-content">
                        <h6>Monto Hoy</h6>
                        <h4 th:text="${montoHoy}">--</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-2 col-6">
                <div class="kpi-card bg-gradient-blue">
                    <div class="kpi-icon">📆</div>
                    <div class="kpi-content">
                        <h6>Semana</h6>
                        <h4 th:text="${ventasSemana}">--</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="kpi-card bg-gradient-purple">
                    <div class="kpi-icon">📅</div>
                    <div class="kpi-content">
                        <h6>Total Mes</h6>
                        <h4 th:text="${montoMes}">--</h4>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-12">
                <div class="kpi-card bg-gradient-navy">
                    <div class="kpi-icon">🏆</div>
                    <div class="kpi-content">
                        <h6>Más Vendido</h6>
                        <strong th:text="${productoTop}">Producto</strong><br>
                        <small>Cantidad: <span th:text="${cantidadTop}">0</span></small>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Gráfico de ventas por hora -->
            <div class="col-lg-6">
                <div class="card shadow-soft h-100 p-3">
                    <h5 class="section-title">🕒 Ventas por Hora</h5>
                    <canvas id="ventasHoraChart"></canvas>
                </div>
            </div>

            <!-- Gráfico de ventas por cliente -->
            <div class="col-lg-6">
                <div class="card shadow-soft h-100 p-3">
                    <h5 class="section-title">🧑‍🤝‍🧑 Ventas por Cliente</h5>
                    <div class="d-flex mb-3 gap-2 flex-wrap">
                        <input type="date" class="form-control" id="fechaInicio" style="max-width: 160px;">
                        <input type="date" class="form-control" id="fechaFin" style="max-width: 160px;">
                        <button class="btn btn-primary" onclick="cargarVentasCliente()">Filtrar</button>
                    </div>
                    <canvas id="ventasClienteChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="js">
        <script th:inline="javascript">
            // Gráfico de ventas por hora
            const horas = /*[[${horas}]]*/[];
            const ventasSemanaActual = /*[[${ventasSemanaActual}]]*/[];
            const ventasSemanaPasada = /*[[${ventasSemanaPasada}]]*/[];

            new Chart(document.getElementById('ventasHoraChart'), {
                type: 'bar',
                data: {
                    labels: horas,
                    datasets: [
                        {
                            label: 'Semana Actual',
                            data: ventasSemanaActual,
                            backgroundColor: 'rgba(52, 152, 219, 0.7)',
                            borderRadius: 8
                        },
                        {
                            label: 'Semana Pasada',
                            data: ventasSemanaPasada,
                            backgroundColor: 'rgba(149, 165, 166, 0.5)',
                            borderRadius: 8
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { display: true, position: 'top' }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: 'Hora del día'
                            }
                        },
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Cantidad de Ventas'
                            },
                            ticks: {
                                stepSize: 1,
                                callback: function (value) {
                                    return Number.isInteger(value) ? value : null;
                                }
                            }
                        }
                    }
                }
            });

            // Gráfico de ventas por cliente
            let chartCliente;

            function cargarVentasCliente() {
                const inicio = document.getElementById("fechaInicio").value;
                const fin = document.getElementById("fechaFin").value;

                if (!inicio || !fin) {
                    alert("Por favor selecciona ambas fechas.");
                    return;
                }

                fetch(`/api/ventas/por-cliente?inicio=${inicio}&fin=${fin}`)
                    .then(response => response.json())
                    .then(data => {
                        const nombres = data.map(item => item.cliente);
                        const montos = data.map(item => item.monto);

                        if (chartCliente) chartCliente.destroy();

                        const ctx = document.getElementById('ventasClienteChart').getContext('2d');
                        chartCliente = new Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels: nombres,
                                datasets: [{
                                    label: 'Monto Total (S/.)',
                                    data: montos,
                                    backgroundColor: 'rgba(241, 196, 15, 0.7)',
                                    borderRadius: 10
                                }]
                            },
                            options: {
                                responsive: true,
                                indexAxis: 'y',
                                plugins: {
                                    legend: { display: false }
                                },
                                scales: {
                                    x: {
                                        beginAtZero: true,
                                        title: {
                                            display: true,
                                            text: 'Monto (S/.)'
                                        }
                                    },
                                    y: {
                                        title: {
                                            display: true,
                                            text: 'Clientes'
                                        }
                                    }
                                }
                            }
                        });
                    })
                    .catch(error => {
                        console.error("Error al obtener datos:", error);
                        alert("Ocurrió un error al cargar los datos.");
                    });
            }

            window.onload = () => {
                const hoy = new Date().toISOString().split("T")[0];
                document.getElementById("fechaInicio").value = hoy;
                document.getElementById("fechaFin").value = hoy;
                cargarVentasCliente();
            };
        </script>
    </th:block>
</body>
</html>
