name: CI/CD - Spring Boot + Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-dockerize:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar el repositorio
      uses: actions/checkout@v3

    - name: ☕ Configurar Java 21
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: 🧪 Compilar con Maven (sin tests)
      run: mvn clean package -DskipTests

    - name: 🐳 Construir imagen Docker
      run: docker build -t sistemaventas-app .

    - name: 🔐 Login en Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: 📦 Hacer push a Docker Hub
      run: |
        docker tag sistemaventas-app ${{ secrets.DOCKER_USERNAME }}/sistemaventas-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/sistemaventas-app:latest
