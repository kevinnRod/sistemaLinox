<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <th:block layout:fragment="head">
        <title>Crear Usuario</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
        <style>
            body {
                background: #f6f8fa;
            }
            .card {
                border-radius: 1rem;
                border: none;
                box-shadow: 0 4px 32px 0 rgba(44,62,80,.10);
            }
            .card-header {
                background: linear-gradient(90deg, #0091ea 0%, #43e97b 100%);
                color: #fff;
                border-top-left-radius: 1rem;
                border-top-right-radius: 1rem;
                box-shadow: 0 2px 8px 0 rgba(44,62,80,.07);
            }
            .form-label {
                font-weight: 500;
                color: #3e4a5c;
            }
            .form-control, .form-select {
                border-radius: 0.7rem;
                font-size: 1rem;
                padding: 0.75rem 1rem;
                border: 1px solid #e0e6ed;
                transition: box-shadow .2s;
            }
            .form-control:focus, .form-select:focus {
                border-color: #0091ea;
                box-shadow: 0 0 0 2px rgba(0,145,234,.10);
            }
            .preview-img {
                width: 70px;
                height: 70px;
                object-fit: cover;
                border-radius: 50%;
                margin: 0 auto 12px auto;
                display: block;
                border: 3px solid #e0e6ed;
                background: #fff;
                box-shadow: 0 2px 8px 0 rgba(44,62,80,.07);
                transition: border-color 0.3s;
            }
            .btn-success {
                background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%);
                border: none;
                color: #fff;
                font-weight: 500;
                border-radius: 0.7rem;
                padding: 0.6rem 2rem;
                transition: background .2s;
            }
            .btn-success:hover {
                background: linear-gradient(90deg, #38f9d7 0%, #43e97b 100%);
            }
            .btn-secondary {
                background: #e0e0e0;
                color: #222;
                border: none;
                border-radius: 0.7rem;
                padding: 0.6rem 2rem;
            }
            .required {
                color: #e53935;
                font-weight: bold;
            }
        </style>
    </th:block>
</head>
<body>
<div layout:fragment="content" class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header text-center">
                    <h4 class="mb-0"><i class="bi bi-person-plus"></i> Crear Nuevo Usuario</h4>
                </div>
                <div class="card-body p-4">
                    <!-- Mensajes de feedback -->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

                    <form th:action="@{/usuario/save}" method="post" enctype="multipart/form-data" autocomplete="off">
                        <!-- Foto de Perfil -->
                        <div class="mb-3 text-center">
                            <img id="imgPreview" class="preview-img d-none" alt="Vista previa de la foto"/>
                            <label for="foto" class="form-label">Foto de Perfil</label>
                            <input type="file" name="foto" class="form-control" id="foto" accept="image/png, image/jpeg" onchange="previewImage(event)" />
                            <div class="form-text">Formatos permitidos: <strong>JPG, PNG</strong>. Máx: 2MB.</div>
                        </div>

                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuario <span class="required">*</span></label>
                            <input type="text" name="usuario" class="form-control" id="usuario"
                                   placeholder="Ingrese el nombre de usuario" required maxlength="30" />
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo <span class="required">*</span></label>
                            <input type="email" name="correo" class="form-control" id="correo"
                                   placeholder="usuario@correo.com" required maxlength="50" />
                        </div>

                        <div class="mb-3">
                            <label for="contrasenaEnc" class="form-label">Contraseña <span class="required">*</span></label>
                            <input type="password" name="contrasenaEnc" class="form-control" id="contrasenaEnc"
                                   placeholder="********" required minlength="6" maxlength="30" />
                        </div>

                        <div class="mb-3">
                            <label for="personaId" class="form-label">Empleado <span class="required">*</span></label>
                            <select name="personaId" class="form-select" id="personaId" required>
                                <option value="">-- Seleccione un empleado --</option>
                                <option th:each="empleado : ${empleadosSinUsuario}" th:value="${empleado.idPersona}"
                                        th:text="${empleado.nombres + ' ' + empleado.apellidos}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="idEstado" class="form-label">Estado <span class="required">*</span></label>
                            <select name="idEstado" class="form-select" id="idEstado" required>
                                <option value="">-- Seleccione --</option>
                                <option value="1">Activo</option>
                                <option value="0">Inactivo</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-save"></i> Guardar
                            </button>
                            <a th:href="@{/usuario}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById('imgPreview');
        if (input.files && input.files[0]) {
            preview.src = URL.createObjectURL(input.files[0]);
            preview.classList.remove('d-none');
        } else {
            preview.src = '';
            preview.classList.add('d-none');
        }
    }
</script>
</body>
</html>
