<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <th:block layout:fragment="head">
        <title>Editar Usuario</title>
        <style>
            body {
                background: #f5f6fa;
            }
            .card-custom {
                border-radius: 1rem;
                box-shadow: 0 4px 24px rgba(0,0,0,0.07);
                border: none;
                background: #fff;
            }
            .card-header-custom {
                background: linear-gradient(90deg, #1976d2 0%, #64b5f6 100%);
                color: #fff;
                font-weight: 700;
                border-bottom: 1px solid #1565c0;
                font-size: 1.25rem;
            }
            .foto-perfil {
                width: 110px;
                height: 110px;
                object-fit: cover;
                border-radius: 50%;
                border: 3px solid #e0e0e0;
                box-shadow: 0 2px 8px rgba(0,0,0,0.06);
                margin-bottom: 10px;
                background: #fafafa;
            }
            .btn-agregar-rol {
                padding: 5px 15px;
                font-size: 0.95rem;
                border-radius: 8px;
                font-weight: 600;
                background: #1976d2;
                color: #fff;
                border: none;
                transition: background 0.15s;
            }
            .btn-agregar-rol:hover {
                background: #1565c0;
                color: #fff;
            }
            .list-group-item {
                border: none;
                border-radius: 8px;
                margin-bottom: 5px;
                background: #f8f9fa;
                transition: background 0.18s;
            }
            .list-group-item:hover {
                background-color: #e3f2fd;
                cursor: pointer;
            }
            .form-control:focus, .form-select:focus {
                border-color: #1976d2;
                box-shadow: 0 0 0 0.12rem rgba(25,118,210,0.10);
            }
            .btn-success {
                background: #43e97b;
                border: none;
                font-weight: 600;
            }
            .btn-success:hover {
                background: #38b36c;
            }
            .btn-danger {
                background: #ff5858;
                border: none;
                font-weight: 600;
            }
            .btn-danger:hover {
                background: #d32f2f;
            }
            .btn-secondary {
                background: #ececec;
                color: #1a1a1a;
                border: none;
                font-weight: 600;
            }
            .btn-secondary:hover {
                background: #e0e0e0;
                color: #212529;
            }
            .modal-content {
                border-radius: 1rem;
                box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.09);
            }
            .modal-header {
                background: linear-gradient(90deg, #1976d2 0%, #64b5f6 100%);
                border-bottom: 1px solid #1565c0;
            }
            .modal-title {
                color: #fff;
                font-weight: 700;
            }
            .form-label {
                font-weight: 500;
            }
            .alert-success {
                background: #e9fbe5;
                color: #256029;
                border: 1px solid #b7ebc6;
            }
            .alert-danger {
                background: #fff0f0;
                color: #a94442;
                border: 1px solid #f5c6cb;
            }
            .btn-actualizar {
                background: #1976d2;
                color: #fff;
                font-weight: 600;
                border: none;
            }
            .btn-actualizar:hover {
                background: #1565c0;
            }
            .btn-cancelar {
                background: #ececec;
                color: #1a1a1a;
                font-weight: 600;
                border: none;
            }
            .btn-cancelar:hover {
                background: #e0e0e0;
                color: #1976d2;
            }

        </style>
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <div class="row justify-content-center py-4">
        <!-- MENSAJES -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- FORMULARIO -->
        <div class="col-lg-10 col-md-11">
            <div class="card card-custom shadow">
                <div class="card-header card-header-custom">
                    <h4 class="mb-0">Editar Usuario</h4>
                </div>
                <div class="row card-body">
                    <!-- FORMULARIO IZQUIERDA -->
                    <div class="col-md-8 border-end">
                        <form th:action="@{'/usuario/actualizar/' + ${usuario.idUsuario}}" method="post" enctype="multipart/form-data">
                            <div class="text-center mb-4">
                                <label class="form-label fw-bold">Foto de Perfil</label><br>
                                <img th:src="${usuario.urlFoto != null && !usuario.urlFoto.isEmpty() 
                                        ? usuario.urlFoto 
                                        : '/images/user-default.png'}"
                                     alt="Foto de Usuario" class="foto-perfil shadow-sm">
                            </div>
                            <div class="mb-3">
                                <label for="foto" class="form-label">Cambiar Foto de Perfil</label>
                                <input type="file" name="foto" class="form-control" id="foto" accept="image/*" />
                            </div>
                            <div class="mb-3">
                                <label for="usuario" class="form-label">Usuario</label>
                                <input type="text" class="form-control" id="usuario" name="usuario"
                                       th:value="${usuario.usuario}" required>
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo</label>
                                <input type="email" class="form-control" id="correo" name="correo"
                                       th:value="${usuario.correo}" required>
                            </div>
                            <div class="mb-3">
                                <label for="contrasena" class="form-label">Nueva Contraseña (opcional)</label>
                                <input type="password" class="form-control" id="contrasena" name="contrasena"
                                       placeholder="********">
                            </div>
                            <div class="mb-3">
                                <label for="idEstado" class="form-label">Estado</label>
                                <select class="form-select" id="idEstado" name="idEstado">
                                    <option value="1" th:selected="${usuario.idEstado == 1}">Activo</option>
                                    <option value="0" th:selected="${usuario.idEstado == 0}">Inactivo</option>
                                </select>
                            </div>
                            <div class="text-end mt-4">
                                <button type="submit" class="btn btn-actualizar me-2 px-4">
                                    <i class="bi bi-check-circle me-1"></i> Actualizar
                                </button>
                                <a th:href="@{'/usuario/ver/' + ${usuario.idUsuario}}" class="btn btn-cancelar px-4">
                                    <i class="bi bi-x-circle me-1"></i> Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                    <!-- TARJETA DERECHA: ROLES -->
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm rounded-4">
                            <div class="card-header card-header-custom d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">Roles Asignados</h5>
                                <button id="asignarRolModalBtn" class="btn btn-agregar-rol">
                                    <i class="bi bi-plus-circle"></i> Rol
                                </button>
                            </div>
                            <div class="card-body">
                                <form th:action="@{/usuarioRol/eliminar}" method="post" id="formEliminarRol"
                                      onsubmit="return confirm('¿Estás seguro de que deseas eliminar este rol?');">
                                    <input type="hidden" name="idUsuario" th:value="${usuario.idUsuario}" />
                                    <input type="hidden" name="idRol" id="idRolSeleccionado" />
                                    <ul class="list-group mb-3">
                                        <li th:each="ur : ${rolesA}" class="list-group-item">
                                            <div class="form-check">
                                                <input class="form-check-input" type="radio" name="rolSeleccionado"
                                                       th:id="'rol-' + ${ur.rol.idRol}" th:value="${ur.rol.idRol}"
                                                       onchange="mostrarBotonEliminar(this.value)">
                                                <label class="form-check-label" th:for="'rol-' + ${ur.rol.idRol}"
                                                       th:text="${ur.rol.nombreRol}"></label>
                                            </div>
                                        </li>
                                    </ul>
                                    <div class="text-end">
                                        <button type="submit" id="btnEliminarRol" class="btn btn-danger d-none">
                                            <i class="bi bi-trash"></i> Eliminar Rol
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                    <!-- FIN TARJETA DERECHA -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL PARA ASIGNAR ROL -->
<div layout:fragment="modal">
    <div class="modal fade" id="asignarRolModal" tabindex="-1" aria-labelledby="asignarRolModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/usuarioRol/asignar}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title">Asignar Rol al Usuario</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" name="idUsuario" th:value="${usuario.idUsuario}">
                        <label for="rol" class="form-label">Selecciona un Rol</label>
                        <select class="form-select" id="rol" name="idRol" required>
                            <option value="" disabled selected>Selecciona un rol</option>
                            <option th:each="rol : ${listaRoles}" th:value="${rol.idRol}"
                                    th:text="${rol.nombreRol}"></option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        <button type="submit" class="btn btn-primary">Asignar Rol</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- JS -->
<th:block layout:fragment="js">
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const btnAbrirModal = document.getElementById('asignarRolModalBtn');
            const modalElement = document.getElementById('asignarRolModal');
            if (modalElement) {
                const modal = new bootstrap.Modal(modalElement);
                btnAbrirModal.addEventListener('click', () => {
                    modalElement.removeAttribute("aria-hidden");
                    modal.show();
                });
            }
        });

        function mostrarBotonEliminar(idRol) {
            document.getElementById("btnEliminarRol").classList.remove("d-none");
            document.getElementById("idRolSeleccionado").value = idRol;
        }

        document.addEventListener('click', function (event) {
            const rolContainer = document.querySelector('.list-group');
            const botonEliminar = document.getElementById("btnEliminarRol");
            if (!rolContainer.contains(event.target)) {
                document.getElementsByName("rolSeleccionado").forEach(radio => radio.checked = false);
                botonEliminar.classList.add("d-none");
            }
        });
    </script>
</th:block>
</body>
</html>
