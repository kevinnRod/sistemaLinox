<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <th:block layout:fragment="head">
        <title>Perfil del Usuario</title>
        <style>
            body {
                background: #f9fafa !important;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            .container {
                margin-top: 40px;
            }

            .card {
                border-radius: 12px !important;
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05) !important;
                border: none !important;
                background-color: #ffffff;
            }

            .card-header {
                background-color: #0B3558 !important;
                color: #fff !important;
                font-weight: 600;
                font-size: 1.2rem;
                border-radius: 12px 12px 0 0 !important;
            }

            .card-body {
                background: #fff !important;
                padding: 2rem;
            }

            .user-profile-image {
                width: 120px;
                height: 120px;
                object-fit: cover;
                border-radius: 50%;
                box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
                border: 4px solid #fff;
            }

            .user-info h4 {
                font-weight: 700;
                font-size: 1.4rem;
                color: #0B3558;
            }

            .user-info p {
                font-size: 1rem;
                margin: 4px 0;
                color: #444;
            }

            .badge {
                padding: 4px 14px;
                border-radius: 20px;
                font-weight: 600;
                font-size: 0.9rem;
            }

            .bg-success {
                background-color: #27ae60 !important;
                color: #fff !important;
            }

            .bg-danger {
                background-color: #e74c3c !important;
                color: #fff !important;
            }

            .card-sub {
                border-radius: 10px !important;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04) !important;
                background: #ffffff !important;
                border: none !important;
            }

            .card-header-sub {
                background-color: #127CA6 !important;
                color: #fff !important;
                font-weight: 600;
                padding: 10px 18px;
                font-size: 1.1rem;
            }

            .card-body-sub {
                padding: 18px 20px;
            }

            ul {
                padding-left: 20px;
                margin-bottom: 0;
            }

            li {
                margin-bottom: 6px;
                font-size: 1rem;
            }

            .rol-link {
                color: #127CA6 !important;
                font-weight: 600;
                text-decoration: none;
                transition: all 0.2s;
            }

            .rol-link:hover {
                color: #0B3558 !important;
                text-decoration: underline;
            }

            .text-end {
                margin-top: 20px;
            }

            .btn-warning {
                background-color: #f4c542 !important;
                color: #1a1a1a !important;
                font-weight: 600;
                border-radius: 8px;
                padding: 8px 22px;
                border: none;
            }

            .btn-warning:hover {
                background-color: #d4a621 !important;
                color: white !important;
            }

            .btn-secondary {
                background-color: #6c757d !important;
                color: #fff !important;
                font-weight: 600;
                border-radius: 8px;
                padding: 8px 22px;
                border: none;
            }

            .btn-secondary:hover {
                background-color: #495057 !important;
            }

            @media (max-width: 768px) {
                .card .row.mb-4 {
                    flex-direction: column;
                    align-items: center;
                }

                .user-profile-image {
                    margin-bottom: 16px;
                }
            }
        </style>
    </th:block>
</head>

<body>
    <div layout:fragment="content">
        <div class="container">
            <!-- Mensajes -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Tarjeta de usuario -->
            <div class="row justify-content-center">
                <div class="col-xl-10">
                    <div class="card mb-4">
                        <div class="card-header">Perfil del Usuario</div>
                        <div class="card-body">
                            <div class="row mb-4 align-items-center">
                                <div class="col-md-3 text-center">
                                    <img th:src="${usuario.urlFoto != null && !usuario.urlFoto.isEmpty() 
                                        ? usuario.urlFoto 
                                        : '/images/user-default.png'}" alt="Foto" class="user-profile-image">
                                </div>
                                <div class="col-md-9 user-info">
                                    <h4 th:text="${usuario.usuario}">Nombre</h4>
                                    <p>Correo: <span th:text="${usuario.correo}">correo</span></p>
                                    <p>Estado:
                                        <span th:classappend="${usuario.idEstado == 1} ? 'badge bg-success' : 'badge bg-danger'"
                                            th:text="${usuario.idEstado == 1 ? 'Activo' : 'Inactivo'}">Estado</span>
                                    </p>
                                    <p>Creado: <span
                                            th:text="${#temporals.format(usuario.createdAt, 'dd/MM/yyyy HH:mm')}">fecha</span></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Roles y permisos -->
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card card-sub mb-4">
                                <div class="card-header card-header-sub">Roles Asignados</div>
                                <div class="card-body card-body-sub">
                                    <ul>
                                        <li th:each="ur : ${rolesA}">
                                            <a href="#" class="rol-link" th:data-id="${ur.rol.idRol}"
                                                th:text="${ur.rol.nombreRol}">Rol</a>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <div class="card card-sub mb-4">
                                <div class="card-header card-header-sub">Permisos del Rol</div>
                                <div class="card-body card-body-sub">
                                    <ul id="permisos-lista">
                                        <li class="text-muted">Seleccione un rol para ver sus permisos.</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Botones -->
                    <div class="text-end">
                        <a th:href="@{'/usuario/editar/' + ${usuario.idUsuario}}" class="btn btn-warning">Editar</a>
                        <a th:href="@{/usuario}" class="btn btn-secondary">Volver</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS para cargar permisos -->
    <th:block layout:fragment="js">
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                document.querySelectorAll(".rol-link").forEach(link => {
                    link.addEventListener("click", function (e) {
                        e.preventDefault();
                        const rolId = this.dataset.id;

                        fetch(`/rolPermiso/permisos/${rolId}`)
                            .then(response => response.json())
                            .then(data => {
                                const lista = document.getElementById("permisos-lista");
                                lista.innerHTML = "";

                                if (data.length === 0) {
                                    lista.innerHTML = "<li class='text-muted'>Este rol no tiene permisos asignados.</li>";
                                } else {
                                    data.forEach(permiso => {
                                        const li = document.createElement("li");
                                        li.textContent = permiso;
                                        lista.appendChild(li);
                                    });
                                }
                            })
                            .catch(error => {
                                const lista = document.getElementById("permisos-lista");
                                lista.innerHTML = "<li class='text-danger'>Error al cargar permisos.</li>";
                                console.error("Error:", error);
                            });
                    });
                });
            });
        </script>
    </th:block>
</body>

</html>
